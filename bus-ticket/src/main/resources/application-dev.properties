# ============================================================
# Profile 'dev' - chay/test cuc bo bang H2 in-memory (khong can SQL Server).
# Kich hoat: chay voi -Dspring-boot.run.profiles=dev
#   hoac  --spring.profiles.active=dev
# Chi phuc vu phat trien/kiem thu FE Customer, khong dung cho production.
# ============================================================

spring.datasource.url=jdbc:h2:mem:bus_ticket;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 web console: http://localhost:8080/h2-console (JDBC URL o tren)
spring.h2.console.enabled=true

# Giu ghe tam 10 phut, job don ghe moi 60s
app.booking.seat-hold-minutes=10
app.booking.cleanup-interval-ms=60000
